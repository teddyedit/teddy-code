<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>Camino Week 01 — IG</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:'Noto Sans TC',system-ui,sans-serif,'Noto Color Emoji'}
  /* flat colour picked off the jacket, like the IG eyedropper */
  .story{position:relative;width:1080px;height:1920px;background:#2f5b51;color:#fff}
  .abs{position:absolute}
  /* photo stickers: rounded corners, small soft shadow, nothing else */
  .ph{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .ph img{display:block;width:100%;height:100%;object-fit:cover}
  /* IG "Classic" text with the background toggle on */
  .hl{display:inline-block;background:#fff;color:#111;font-weight:700;border-radius:10px;padding:6px 16px 8px;line-height:1.25}
  .txt{font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  .loc{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:12px 20px 12px 16px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);white-space:nowrap;font:900 26px/1 'Noto Sans TC',sans-serif;letter-spacing:.01em}
  .loc span{background:linear-gradient(90deg,#8a3ab9,#e95950 60%,#fccc63);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<div class="story">
  <div class="abs txt" style="left:0;right:0;top:200px;text-align:center;font-size:76px;font-weight:900">朝聖之路 第一週 🥾</div>
  <div class="abs" style="left:0;right:0;top:318px;text-align:center"><span class="hl" style="font-size:38px">巴黎 → Zubiri　10/2–10/8</span></div>

  <div class="ph" style="left:56px;top:410px;width:720px;height:540px;transform:rotate(-2.5deg)"><img src="photos/1005-pyrenees-hd.jpg"></div>
  <div class="abs" style="left:96px;top:862px;transform:rotate(-2.5deg)"><span class="hl" style="font-size:36px">10/5 翻過庇里牛斯山了 ⛰️</span></div>

  <div class="ph" style="left:640px;top:610px;width:390px;height:292px;transform:rotate(5deg)"><img src="photos/1003-sjpp-shop.jpg"></div>
  <div class="abs" style="left:588px;top:900px;transform:rotate(4deg)"><span class="loc">📍<span>SAINT-JEAN-PIED-DE-PORT</span></span></div>

  <div class="ph" style="left:44px;top:1010px;width:480px;height:360px;transform:rotate(2deg)"><img src="photos/1004-view.jpg"></div>
  <div class="ph" style="left:586px;top:990px;width:420px;height:560px;transform:rotate(-3deg)"><img src="photos/1006-rain.jpg" style="object-position:50% 60%"></div>
  <div class="abs" style="left:640px;top:1480px;transform:rotate(-3deg)"><span class="hl" style="font-size:34px">10/7 下雨也要走 ☔️</span></div>

  <div class="ph" style="left:70px;top:1330px;width:500px;height:375px;transform:rotate(-1.5deg)"><img src="photos/dinner.jpg"></div>
  <div class="abs" style="left:96px;top:1630px;transform:rotate(-1.5deg)"><span class="hl" style="font-size:32px">10/8 晚餐認識一堆新朋友 🥘</span></div>

  <div class="abs txt" style="left:0;right:0;top:1728px;text-align:center;font-size:40px;line-height:1.45">走了 47km・3天・花 €263<br><span style="font-weight:500;font-size:34px">Buen Camino 🐚 明天往 Pamplona</span></div>
</div>
</body></html>
